# Template — copy to k8s/secret.yaml and fill in real values, then apply.
# DO NOT commit the populated file. Better: create the Secret with kubectl:
#
#   kubectl -n gradpilot create secret generic gradpilot-secrets \
#     --from-literal=GEMINI_API_KEY=... \
#     --from-literal=GROQ_API_KEY=... \
#     --from-literal=GROQ_FALLBACK_KEY_1=... \
#     --from-literal=GROQ_FALLBACK_KEY_2=... \
#     --from-literal=SERPER_API_KEY=... \
#     --from-literal=ELEVENLABS_API_KEY=... \
#     --from-literal=ELEVENLABS_VOICE_ID=... \
#     --from-literal=ELEVENLABS_FALLBACK_VOICE_ID=... \
#     --from-literal=ELEVENLABS_MODEL_ID=eleven_multilingual_v2 \
#     --from-literal=GOOGLE_PLACES_API_KEY=... \
#     --from-literal=SUPABASE_SERVICE_ROLE_KEY=... \
#     --from-literal=NEXT_PUBLIC_SUPABASE_URL=https://xxx.supabase.co \
#     --from-literal=NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJ... \
#     --from-literal=NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=AIza...

apiVersion: v1
kind: Secret
metadata:
  name: gradpilot-secrets
  namespace: gradpilot
type: Opaque
stringData:
  # ── Public (baked into the image at build time or passed to frontend) ───
  NEXT_PUBLIC_SUPABASE_URL: "https://YOUR-PROJECT.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "REPLACE_ME_ANON_KEY"
  NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: "REPLACE_ME_GOOGLE_MAPS"

  # ── Server-side (never exposed to the browser) ──────────────────────────
  SUPABASE_SERVICE_ROLE_KEY: "REPLACE_ME_SUPABASE_SERVICE_ROLE_KEY"
  GROQ_API_KEY: "REPLACE_ME_GROQ"
  GROQ_FALLBACK_KEY_1: "REPLACE_ME_GROQ_FALLBACK_1"
  GROQ_FALLBACK_KEY_2: "REPLACE_ME_GROQ_FALLBACK_2"
  GEMINI_API_KEY: "REPLACE_ME_GEMINI"
  SERPER_API_KEY: "REPLACE_ME_SERPER"
  GOOGLE_PLACES_API_KEY: "REPLACE_ME_GOOGLE_PLACES"
  ELEVENLABS_API_KEY: "REPLACE_ME_ELEVENLABS_API_KEY"
  ELEVENLABS_VOICE_ID: "REPLACE_ME_ELEVENLABS_VOICE_ID"
  ELEVENLABS_FALLBACK_VOICE_ID: "REPLACE_ME_ELEVENLABS_FALLBACK_VOICE_ID"
  ELEVENLABS_MODEL_ID: "eleven_multilingual_v2"
