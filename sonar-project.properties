# SonarQube / SonarCloud project config for EduFin
sonar.projectKey=EduFin
sonar.projectName=EduFin
sonar.sources=src,extension/src
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/node_modules/**,**/.next/**,**/extension/dist/**,**/public/**,scripts/**,**/*.css,**/*.svg,tests/**

# TypeScript + Next.js project layout
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json
